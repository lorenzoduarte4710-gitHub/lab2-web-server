<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${status} ${error} · Lab 2|">Error · Lab 2</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f8;
            color: #2c3e50;
            font-family: "Segoe UI", Tahoma, sans-serif;
        }
        main {
            width: min(90%, 32rem);
            padding: 2rem;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        h1 {
            margin: 0;
            font-size: 4rem;
            color: #c0392b;
        }
        .reason {
            margin: 0 0 1rem;
            font-size: 1.25rem;
        }
        table {
            width: 100%;
            margin: 1.5rem 0;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 0.5rem;
            border-bottom: 1px solid #e1e5ea;
        }
        th {
            width: 30%;
            color: #7f8c8d;
            font-weight: normal;
        }
        td {
            font-family: Consolas, monospace;
        }
        nav a {
            margin: 0 0.75rem;
            color: #2980b9;
        }
        footer {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #95a5a6;
        }
    </style>
</head>
<body>
<main>
    <h1 th:text="${status}">Error</h1>
    <p class="reason" th:text="${error}">Unexpected error</p>
    <p>Something went wrong with your request. The details below may help.</p>

    <table>
        <tr>
            <th>Status</th>
            <td th:text="${status}">-</td>
        </tr>
        <tr>
            <th>Error</th>
            <td th:text="${error}">-</td>
        </tr>
        <tr>
            <th>Path</th>
            <td th:text="${path}">-</td>
        </tr>
        <tr>
            <th>Time</th>
            <td th:text="${#dates.format(timestamp, 'yyyy-MM-dd HH:mm:ss')}">-</td>
        </tr>
    </table>

    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/time}">Server time</a>
    </nav>

    <footer>Web Engineering 2026-27 · Lab 2 error page</footer>
</main>
</body>
</html>
